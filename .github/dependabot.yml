version: 2
updates:
  - package-ecosystem: composer
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:30"
      timezone: "Europe/Amsterdam"
    allow:
      - dependency-name: "freemius/wordpress-sdk"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore"
