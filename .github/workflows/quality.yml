name: quality

on:
  workflow_call:
  # No `pull_request:` trigger and no `push:` trigger, both deliberately.
  #
  # A PR trigger fired on every push to a branch, which made iterating - the
  # normal way work happens - the largest single consumer of our Actions
  # minutes. Removing it left `push` to main as the next largest: every merge
  # started the whole matrix, the wp-env Plugin Check and the Playwright run,
  # several times on a busy day, to re-check work that was already verified
  # locally before the PR was opened.
  #
  # So CI now runs in exactly two places: on demand, and as the release gate.
  # release.yml calls this workflow through `workflow_call`, so nothing is ever
  # published without it passing.
  #
  # The trade-off is real and worth stating: main carries no automated
  # verification between merges, and a break can sit there until someone cuts a
  # release or dispatches a run. That is why local verification before a PR is
  # not optional - phpcs and phpunit in the wordpress_localhost stack, plus
  # `npm run lint:js` and `npm run lint:css`.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coding-standards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "7.4"
          tools: composer
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: composer lint
      - name: Check PHP syntax
        run: find . -path ./vendor -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: bash -n bin/build.sh bin/install-wp-tests.sh

  php-compatibility:
    # `composer lint` pins PHPCompatibility 9.3.5 (the newest release that works
    # with WPCS 3 / PHP_CodeSniffer 3), which predates the PHP 8.1-8.5 sniffs. The
    # WooCommerce Marketplace code compatibility test runs current
    # PHPCompatibilityWP, so run the same modern sniffs here - installed in their
    # own project because they need PHP_CodeSniffer 4.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer
          coverage: none
      - name: Install current PHPCompatibility sniffs
        run: |
          mkdir -p "$RUNNER_TEMP/phpcompat"
          cd "$RUNNER_TEMP/phpcompat"
          printf '{"minimum-stability":"dev","prefer-stable":true,"config":{"allow-plugins":{"dealerdirect/phpcodesniffer-composer-installer":true}}}' > composer.json
          composer require --no-interaction phpcompatibility/php-compatibility:dev-develop
      - name: Scan for PHP 7.4-8.5 incompatibilities
        run: |
          "$RUNNER_TEMP/phpcompat/vendor/bin/phpcs" \
            --standard=PHPCompatibility \
            --runtime-set testVersion 7.4-8.5 \
            --extensions=php \
            --ignore='*/vendor/*,*/node_modules/*,*/dist/*,*/test-results/*' \
            --warning-severity=1 \
            -p .

  phpunit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: "7.4"
            wordpress: "6.9.5"
            woocommerce: "10.9.4"
          - php: "7.4"
            wordpress: "7.0.2"
            woocommerce: "11.0.0"
          - php: "8.3"
            wordpress: "6.9.5"
            woocommerce: "10.9.4"
          - php: "8.3"
            wordpress: "7.0.2"
            woocommerce: "11.0.0"
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - name: Install WooCommerce test dependency
        run: |
          curl --fail --location --silent --show-error \
            https://downloads.wordpress.org/plugin/woocommerce.${{ matrix.woocommerce }}.zip \
            --output /tmp/woocommerce.zip
          unzip -q /tmp/woocommerce.zip -d ..
      - name: Install WordPress test environment
        run: |
          bash bin/install-wp-tests.sh \
            wordpress_test root root 127.0.0.1:3306 "${{ matrix.wordpress }}" \
            >> "$GITHUB_ENV"
      - run: composer test

  admin-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build --if-present
      - run: npx playwright install --with-deps chromium
      - run: npm run wp-env start
      - name: Seed admin quality records
        run: npx wp-env run cli wp eval-file wp-content/plugins/laqi-unit-stock-manager/tests/e2e/seed-admin-quality.php
      - run: npm run test:admin-quality
      - name: Show WordPress logs after a failure
        if: failure()
        run: npx wp-env logs --watch=false
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: admin-quality-diagnostics
          path: test-results/
      - name: Stop WordPress environment
        if: always()
        run: npm run wp-env stop

  wordpressorg-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build --if-present
      - name: Build the WordPress.org submission package
        run: |
          bash bin/build.sh --channel wordpressorg
          mkdir -p wordpressorg-build
          unzip -q dist/*-wordpressorg.zip -d wordpressorg-build
      # Not wordpress/plugin-check-action: its wp-version input is honoured only
      # for the literal 'trunk' and maps every other value to `null`, so it
      # cannot be told which WordPress to use and resolves "latest" as a git ref.
      # api.wordpress.org offers a release before the mirror tags it, so runs
      # fail for the hours in between. bin/ci-plugin-check.sh pins core to the
      # release zip instead, which is current and cannot race. Reasoning in full
      # is in that file.
      - name: Run official WordPress Plugin Check
        run: bash bin/ci-plugin-check.sh laqi-unit-stock-manager ./wordpressorg-build/laqi-unit-stock-manager

  wordpressorg-archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "7.4"
          tools: composer
          coverage: none
      - name: Build and verify the complete Free archive
        shell: bash
        run: |
          release_version="$(grep -oP '^\s*\*\s*Version:\s*\K\S+' laqi-unit-stock-manager.php | head -n1)"
          bash bin/build.sh --channel wordpressorg

          free_archive="dist/laqi-unit-stock-manager-${release_version}-wordpressorg.zip"
          free_contents="$(unzip -Z1 "$free_archive")"

          if ! unzip -p "$free_archive" laqi-unit-stock-manager/laqi-unit-stock-manager.php | grep '^ \* Plugin Name:       Laqi Unit Stock Manager for WooCommerce$' > /dev/null; then
            echo "::error::WordPress.org archive is missing the Free plugin name."
            exit 1
          fi

          for forbidden in .wp-env.json playwright.config.js docs/ wordpress-org-assets/ tests/ test-results/ .github/ package.json package-lock.json README.md phpunit.integration.xml.dist vendor/ freemius/; do
            if grep -q "^laqi-unit-stock-manager/${forbidden}" <<< "$free_contents"; then
              echo "::error::Release archive contains development-only path: $forbidden"
              exit 1
            fi
          done

          if grep -Eq '(^|/)\.[^/]+(/|$)|\.(zip|tar|tgz|phar)(~|$)|~$' <<< "$free_contents"; then
            echo "::error::Release archive contains a hidden path, archive, or backup file."
            exit 1
          fi

          for required in \
            laqi-unit-stock-manager/readme.txt \
            laqi-unit-stock-manager/changelog.txt \
            laqi-unit-stock-manager/languages/laqi-unit-stock-manager.pot; do
            if ! grep -qx "$required" <<< "$free_contents"; then
              echo "::error::Free archive is missing required file: $required"
              exit 1
            fi
          done
