			<text x="62" y="88" text-anchor="middle" fill="#1b2540" font-family="Arial, sans-serif" font-size="23" font-weight="700">−2 kg</text>
		</g>
		<rect x="145" y="344" width="150" height="48" rx="24" fill="#e2641e"/>
