<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1544 500" role="img" aria-labelledby="title desc">
	<title id="title">Laqi Unit Stock Manager for WooCommerce</title>
	<desc id="desc">One physical inventory pool supplying products sold in several package sizes.</desc>
