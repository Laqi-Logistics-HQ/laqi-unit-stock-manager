		<text x="0" y="147" fill="#ffffff" font-family="Arial, sans-serif" font-size="66" font-weight="700">Unit Stock Manager</text>
		<text x="0" y="207" fill="#d9deea" font-family="Arial, sans-serif" font-size="32">One stock quantity shared across package sizes.</text>
