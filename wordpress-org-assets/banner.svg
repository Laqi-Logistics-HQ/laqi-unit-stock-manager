<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1544 500" role="img" aria-labelledby="title desc">
	<title id="title">Laqi Unit Stock Manager for WooCommerce</title>
	<desc id="desc">One shared 10 kilogram inventory pool supplies three linked products that consume 250 grams, 1 kilogram, and 2 kilograms.</desc>
	<rect width="1544" height="500" fill="#1b2540"/>
	<circle cx="1390" cy="64" r="250" fill="#25314f"/>
	<circle cx="116" cy="470" r="235" fill="#222e4a"/>
	<g transform="translate(110 92)">
		<text x="0" y="58" fill="#e2641e" font-family="Arial, sans-serif" font-size="31" font-weight="700" letter-spacing="2">Laqi Logistics</text>
		<text x="0" y="147" fill="#ffffff" font-family="Arial, sans-serif" font-size="66" font-weight="700">Unit Stock Manager</text>
		<text x="0" y="207" fill="#d9deea" font-family="Arial, sans-serif" font-size="32">One stock pool shared by every linked product.</text>
		<rect x="0" y="252" width="350" height="58" rx="29" fill="#e2641e"/>
		<text x="175" y="291" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="25" font-weight="700">Exact units. One shared pool.</text>
	</g>
	<g transform="translate(1045 48)" font-family="Arial, sans-serif">
		<!-- One continuous relationship network, painted behind the pool and products. -->
		<path d="M220 135v55M62 190h316M62 190v40M220 190v40M378 190v40" fill="none" stroke="#e2641e" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

		<!-- Shared inventory pool. -->
		<path d="M128 44c0-16 41-29 92-29s92 13 92 29v84c0 16-41 29-92 29s-92-13-92-29z" fill="#ffffff"/>
		<ellipse cx="220" cy="44" rx="92" ry="29" fill="#eef0f5"/>
		<ellipse cx="220" cy="44" rx="70" ry="17" fill="#8a93a8"/>
		<text x="220" y="99" text-anchor="middle" fill="#1b2540" font-size="31" font-weight="700">10 kg</text>
		<text x="220" y="126" text-anchor="middle" fill="#8a93a8" font-size="15" font-weight="700" letter-spacing="2">SHARED POOL</text>

		<!-- Three differently sized products consume the same physical stock. -->
		<g transform="translate(0 230)">
			<rect width="124" height="104" rx="16" fill="#ffffff"/>
			<text x="62" y="30" text-anchor="middle" fill="#8a93a8" font-size="13" font-weight="700" letter-spacing="1.2">LINKED ITEM</text>
			<path d="M25 45h74M25 59h48" fill="none" stroke="#cfd7e6" stroke-width="7" stroke-linecap="round"/>
			<text x="62" y="89" text-anchor="middle" fill="#1b2540" font-size="23" font-weight="700">250 g</text>
		</g>
		<g transform="translate(158 230)">
			<rect width="124" height="104" rx="16" fill="#ffffff"/>
			<text x="62" y="30" text-anchor="middle" fill="#8a93a8" font-size="13" font-weight="700" letter-spacing="1.2">LINKED ITEM</text>
			<path d="M25 45h74M25 59h48" fill="none" stroke="#cfd7e6" stroke-width="7" stroke-linecap="round"/>
			<text x="62" y="89" text-anchor="middle" fill="#1b2540" font-size="23" font-weight="700">1 kg</text>
		</g>
		<g transform="translate(316 230)">
			<rect width="124" height="104" rx="16" fill="#ffffff"/>
			<text x="62" y="30" text-anchor="middle" fill="#8a93a8" font-size="13" font-weight="700" letter-spacing="1.2">LINKED ITEM</text>
			<path d="M25 45h74M25 59h48" fill="none" stroke="#cfd7e6" stroke-width="7" stroke-linecap="round"/>
			<text x="62" y="89" text-anchor="middle" fill="#1b2540" font-size="23" font-weight="700">2 kg</text>
		</g>
	</g>
</svg>
