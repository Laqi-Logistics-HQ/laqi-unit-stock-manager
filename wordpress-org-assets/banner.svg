		<ellipse cx="220" cy="44" rx="70" ry="17" fill="#8a93a8"/>
		<text x="220" y="99" text-anchor="middle" fill="#1b2540" font-family="Arial, sans-serif" font-size="31" font-weight="700">10 kg</text>
		<text x="220" y="126" text-anchor="middle" fill="#8a93a8" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2">STOCK POOL</text>
		<g transform="translate(0 222)">
			<rect width="124" height="104" rx="16" fill="#ffffff"/>
			<text x="62" y="27" text-anchor="middle" fill="#8a93a8" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">ORDER</text>
			<path d="M25 42h74M25 56h48" fill="none" stroke="#8a93a8" stroke-width="7" stroke-linecap="round"/>
			<text x="62" y="88" text-anchor="middle" fill="#1b2540" font-family="Arial, sans-serif" font-size="23" font-weight="700">−250 g</text>
		</g>
		<g transform="translate(158 222)">
			<rect width="124" height="104" rx="16" fill="#ffffff"/>
			<text x="62" y="27" text-anchor="middle" fill="#8a93a8" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">ORDER</text>
			<path d="M25 42h74M25 56h48" fill="none" stroke="#8a93a8" stroke-width="7" stroke-linecap="round"/>
			<text x="62" y="88" text-anchor="middle" fill="#1b2540" font-family="Arial, sans-serif" font-size="23" font-weight="700">−750 g</text>
		</g>
		<g transform="translate(316 222)">
			<rect width="124" height="104" rx="16" fill="#ffffff"/>
			<text x="62" y="27" text-anchor="middle" fill="#8a93a8" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">ORDER</text>
